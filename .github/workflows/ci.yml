name: ci

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E (headless WebGL via SwiftShader)
        # "@motion" tests assert simulated distances/velocities in wall-clock time; GitHub's
        # 2-core runners + software WebGL can't hold real-time physics, so they flake there.
        # They still run in the full local suite (npm run test:e2e) — see CONTRIBUTING.md.
        run: npx playwright test --grep-invert "@motion"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
